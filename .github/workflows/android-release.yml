name: Smart Wallet Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Select source ref
        id: source
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Type check and web build
        run: |
          npm run lint
          npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Generate Android launcher icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python scripts/generate-android-icons.py

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs" in s:
              raise SystemExit("Unexpected existing signing configuration; refusing to overwrite it.")
          signing = """    signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          if "android {" not in s or "buildTypes {" not in s or "release {" not in s:
              raise SystemExit("Generated Gradle file has an unexpected structure.")
          s = s.replace("android {", "android {\\n" + signing, 1)
          build_types = s.index("buildTypes {")
          release_type = s.index("release {", build_types)
          s = s[:release_type] + s[release_type:].replace(
              "release {",
              "release {\\n            signingConfig signingConfigs.release",
              1,
          )
          p.write_text(s)
          PY

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature and launcher icon
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/smart-wallet-release-badging.txt
          grep -Eq "^application:.*icon=|^application-icon(-[0-9]+)?: " /tmp/smart-wallet-release-badging.txt
          grep -q "ic_launcher" /tmp/smart-wallet-release-badging.txt
          mkdir -p release
          cp "$APK" "release/Smart-Wallet-${{ steps.source.outputs.tag }}.apk"
          sha256sum "release/Smart-Wallet-${{ steps.source.outputs.tag }}.apk" > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          target_commitish: main
          name: Smart Wallet ${{ steps.source.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/Smart-Wallet-${{ steps.source.outputs.tag }}.apk
            release/SHA256SUMS.txt
