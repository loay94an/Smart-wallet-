name: Smart Wallet quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/smart-wallet-data-security]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --json
        continue-on-error: true
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Build web application
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Generate and verify Android launcher icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python scripts/generate-android-icons.py
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-wallet-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
